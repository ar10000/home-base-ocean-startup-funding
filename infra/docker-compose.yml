# Local environment (handbook section 2): Postgres and Keycloak in containers; the API and
# web app run on the host with `make dev-api` and `make dev-web`. Local development
# credentials only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: home_base
      POSTGRES_USER: home_base
      POSTGRES_PASSWORD: home_base_local
    ports:
      - "127.0.0.1:54320:5432"  # 54320, so it never clashes with a Postgres already on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U home_base -d home_base"]
      interval: 2s
      timeout: 3s
      retries: 15

  keycloak:
    # Same version as the sign-in tests (api/tests/integration/conftest.py). The realm is
    # imported on first start: the web client (PKCE), open registration and one fictional
    # founder. Email-code sign-in is configured on the hosted Keycloak (ADR-006), not here.
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only-not-a-secret
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/home-base-dev.json:/opt/keycloak/data/import/home-base-dev.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
