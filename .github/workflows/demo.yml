name: demo

# The public demo (D-79) on GitHub Pages: the web app over a recorded, fictional snapshot,
# with no API and no sign-in. Skipped while the repository is private (Pages would cost).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: cd web && npm ci && cd .. && make demo-build DEMO_BASE=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist-demo
      - id: deploy
        uses: actions/deploy-pages@v4
