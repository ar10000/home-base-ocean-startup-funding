name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # v8+ publishes exact tags only
        with:
          version: "0.5.14"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: cd api && uv sync --frozen
      - name: Lint, types, rule traceability
        run: make check
      - name: Tests with branch coverage
        run: make test
      - name: Generated files are up to date
        run: git diff --exit-code docs/rules/traceability.md

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # v8+ publishes exact tags only
        with:
          version: "0.5.14"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: (cd api && uv sync --frozen) && (cd web && npm ci)
      - name: Generated client is up to date
        run: make client && git diff --exit-code web/openapi.json web/src/api/
      - name: Format, lint, types, tests, build
        run: make web
      - name: Dependency audit (handbook section 13)
        run: cd web && npm audit --audit-level=high --omit=dev

  e2e:
    # Handbook section 9: the golden path on every PR, against the local stack in Docker.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # v8+ publishes exact tags only
        with:
          version: "0.5.14"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: (cd api && uv sync --frozen) && (cd web && npm ci) && (cd web && npx playwright install --with-deps chromium)
      - name: Local stack (Postgres, Keycloak, migrations, fictional opportunities)
        run: make dev-up
      - name: Golden path
        run: cd web && npm run e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # v8+ publishes exact tags only
        with:
          version: "0.5.14"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: cd api && uv sync --frozen
      - name: Mutation tests (handbook section 9)
        run: make mutation

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read  # gitleaks lists the PR's commits to scan them
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false  # commenting needs pull-requests: write; the failing job is the signal
          GITLEAKS_VERSION: 8.24.3  # keep equal to the gitleaks rev in .pre-commit-config.yaml
